server:
  port: 8888

spring:
  application:
    name: job-portal-config-server

  cloud:
    config:
      server:
        git:
          uri: "https://github.com/vicky-kadam/job-portal-config"
          clone-on-start: true
          default-label: main
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

