server:
  port: ${SERVER_PORT:7004}

spring:
  application:
    name: job-portal-resume-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/job_portal_resume?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
